[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramabana"
dynamic = ["version"]
description = "rama's arrow. a harness that does not miss"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "shalya>=0.0.6",
    "uraiyadal>=0.0.6",
    "gheasy>=0.0.9",
    "exhash>=0.4.9",
    "fastcore>=2.1.16",
    "rishi>=0.1.32",
    "fossick>=0.1.17",
    "koshas>=0.1.7",
    "litesearch>=0.1.1",
    "liteparse>=2.12,<2.13",
    "rgapi>=0.1.19",
    "vishalakshi>=0.1.14",
    "fastspec>=0.2.1",
    "pyyaml>=6.0",
    # Was `[mcp]`, `[cron]`, `[pyrepl]` and `[acp]`. Leela is the package that uses ramabana, and it
    # installs all of them, so the split bought nothing but four ways to have the wrong one.
    "mcp>=1.2",                        # `ramabana.mcp`, and the `ramabana-mcp` script
    "pobblebonk>=0.0.3",               # the beat and the shared database. See `ramabana.monitor.pob`
    "dhrishti>=0.1.2",                 # the python repl
    "jupyter-client>=8.9.1",
    "agent-client-protocol>=0.12.1",   # `ramabana.racp`, and the `ramabana-acp` script
]

[project.optional-dependencies]
# The terminal UI, which a library embedding ramabana does not need. Everything else ramabana
# imports is a base dependency.
cli = ["teleprint>=0.1.1", "pyghostty>=0.1.0"]
[project.urls]
Repository = "https://github.com/vedicreader/ramabana"
Documentation = "https://vedicreader.github.io/ramabana/"

[project.scripts]
ramabana = "ramabana.cli:main"
ramabana-mcp = "ramabana.mcp:main"
ramabana-acp = "ramabana.racp:main"
ramabana-tick = "ramabana.monitor:tick"

[project.entry-points.nbdev]
ramabana = "ramabana._modidx:d"

[project.entry-points.pyskills]
coding_patterns = "ramabana.coding_patterns"
theory = "ramabana.theory"
write_prose = "ramabana.write_prose"
write_docs = "ramabana.write_docs"

[tool.nbdev]
allowed_cell_metadata_keys = ["leela"]

[tool.hatch.build.targets.wheel]
packages = ["ramabana"]

[tool.hatch.build.targets.sdist]
include = ["/ramabana", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "ramabana/__init__.py"

[dependency-groups]
dev = ["ramabana[cli]", "rishi[all]>=0.1.32", "nbdev>=3.3.11", "notebook>=7.6.1", "pytest>=8.0.0"]

[tool.uv]
override-dependencies = ["python-fastllm>=0.0.45"]

#: The toolset is developed beside this package. Point at the checkout so a change to one is
#: testable against the other before either is released.
[tool.uv.sources]
shalya = { path = "../shalya", editable = true }
