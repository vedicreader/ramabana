[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramabana"
dynamic = ["version"]
description = "rama's arrow. a harness that does not miss"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # `requires-python` is what a resolver enforces, but the classifiers are what a person
    # reads on the package page -- and saying only "Python 3" there while refusing to install
    # on 3.11 is the sort of thing you find out from a failed install.
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "exhash>=0.4.9",           # hash-verified line addressing: how the agent edits files safely
    "fastcore>=2.1.16",        # fenced_blocks / str_diff, behind the completion and diff surfaces
    # Every model runtime, including MLX and hosted FastLLM. 0.1.11 is `rishi.claude`, which the
    # `claude/...` models need: without it `runtime_available('claude')` answers False and they do
    # not appear at all, which is a quietly smaller agent rather than a failure anyone would notice.
    # 0.1.12 is `token_count` reporting what the window holds rather than what the turn was billed:
    # under it a claude turn refused itself over an empty window and cursor never compacted at all.
    # 0.1.13 is `model_caps`/`Caps` and `gen_media`. Below it `spec_caps` answers None, so the
    # status bar says nothing about modalities and audio is sent to models that cannot hear it --
    # a quietly worse agent rather than a failure, which is exactly what a floor is for.
    # 0.1.14, not 0.1.13: on 0.1.13 `norm_completion` reads `comp.raw` as a plain attribute, so
    # every Completion-shaped object without one raises AttributeError mid-turn.
    "rishi>=0.1.14",
    "fossick>=0.1.11",          # first-party web research primitives and skill. 0.1.11 is the
                                # RRF-fused search and the research that reports what it could
                                # not read, which `LocalHost.research` returns the digest of
    "koshas>=0.0.31",           # first-party repo/environment context primitives and skill
    "litesearch>=0.1.1",        # RRF fusion shared with Vault.federate
    "rgapi>=0.1.19",            # ripgrep / fd primitives behind LocalHost.search and grep
    "fastllm-claude-code>=0.0.7",
    # `vault.py` calls `federate`, `web`, `ask(instruction=)` and `acquire.ACTIONS`; a 0.0.1 has
    # none of them, so the floor was low enough to resolve a release that cannot work.
    "vishalakshi>=0.1.7",
    # `spec.py` parses OpenAPI, Google discovery and GraphQL introspection through fastspec, and
    # reads a document as YAML when it is not JSON. Both were only ever present transitively --
    # fastspec via ghapi and python-fastllm -- so `api_call` worked by accident of the resolver.
    "fastspec>=0.2.1",
    "pyyaml>=6.0",
]

# Applications may supply their own implementations through Host; these dependencies make
# Ramabana's standard research/search vocabulary available without importing an IDE.

[project.optional-dependencies]
# The terminal app. teleprint owns the transcript surface; pyghostty is what makes it
# testable, since the whole UI is asserted against a headless emulator in 05_cli.ipynb.
cli = ["teleprint>=0.1.1", "pyghostty>=0.1.0"]
mcp = ["mcp>=1.2"]
all = ["ramabana[cli,mcp,pyrepl]"]
# Every notebook is executed by `nbdev-test`, including the cli and mcp pages, so the dev
# environment needs both frontends' dependencies or CI cannot run the docs as tests.
dev = ["ramabana[all]", "rishi[all]>=0.1.14", "nbdev>=3.3.11", "notebook>=7.6.1", "pytest>=8.0.0"]
# pyrepl is the terminal app plus a kernel, so it needs the cli extra as well as its own.
pyrepl = [
    "ramabana[cli]",
    "dhrishti>=0.1.2",
    "jupyter-client>=8.9.1",
]

[project.urls]
Repository = "https://github.com/vedicreader/ramabana"
Documentation = "https://vedicreader.github.io/ramabana/"

[project.scripts]
ramabana = "ramabana.cli:main"
ramabana-mcp = "ramabana.mcp:main"

[project.entry-points.nbdev]
ramabana = "ramabana._modidx:d"

[project.entry-points.pyskills]
coding_patterns = "ramabana.coding_patterns"

[tool.nbdev]
# leela tags cells with `leela.context`; without this, `nbdev-clean` strips it and CI then
# fails on the diff it just created.
allowed_cell_metadata_keys = ["leela"]

[tool.hatch.build.targets.wheel]
packages = ["ramabana"]

[tool.hatch.build.targets.sdist]
include = ["/ramabana", "/nbs", "/tests", "/CHANGELOG.md", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "ramabana/__init__.py"

[dependency-groups]
# One definition, in the extra above. This is the uv entry point onto it, so `uv sync --group dev`
# and `pip install ramabana[dev]` cannot drift apart.
dev = ["ramabana[dev]"]
