[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramabana"
dynamic = ["version"]
description = "rama's arrow. a harness that does not miss"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "shalya>=0.1.1",   # generate_image(images=, path=) with guarded destinations; picture checks by bytes; memory_search rows
    "uraiyadal>=0.0.8",   # a refused approval's reason (`Ask.reply`) reaches the model
    "gheasy>=0.0.10",
    "exhash>=0.4.9",
    "fastcore>=2.1.16",
    "rishi>=0.1.39",   # chats sharing a LiteRT engine take turns (engine_lock); a second chat on the same thread raises EngineBusy instead of hanging
    "fastspec>=0.2.1",
    "pyyaml>=6.0",
    "pobblebonk>=0.0.3",
]

[project.optional-dependencies]
search = ["vishalakshi>=0.1.17",   # note(key=), folder watches, age/stale
          "litesearch>=0.1.35", "koshas>=0.1.9",   # `rows` hands `code_row` the hit, so the federated repo leg works
          "rgapi>=0.1.19", "fossick>=0.1.17"]
python = ["dhrishti>=0.1.2", "jupyter-client>=8.9.1", "rich"]
serve = ["mcp>=1.2", "agent-client-protocol>=0.12.1"]
dhrona = ["dhrona>=0.1.4"]
cli = ["ramabana[search,python]", "teleprint>=0.1.1", "pyghostty>=0.1.0", "shalya[tmux]>=0.1.1", "fastpylight>=0.1.18"]
all = ["ramabana[search,python,serve,dhrona,cli]"]

[project.urls]
Repository = "https://github.com/vedicreader/ramabana"
Documentation = "https://vedicreader.github.io/ramabana/"

[project.scripts]
ramabana = "ramabana.setup:run_cli"
ramabana-mcp = "ramabana.setup:run_mcp"
ramabana-acp = "ramabana.setup:run_acp"
ramabana-tick = "ramabana.monitor:tick"
ramabana-pane = "ramabana.setup:run_pane"

[project.entry-points.nbdev]
ramabana = "ramabana._modidx:d"

[project.entry-points.pyskills]
coding_patterns = "ramabana.coding_patterns"
theory = "ramabana.theory"
write_prose = "ramabana.write_prose"
write_docs = "ramabana.write_docs"

[tool.nbdev]
allowed_cell_metadata_keys = ["leela"]

[tool.hatch.build.targets.wheel]
packages = ["ramabana"]

[tool.hatch.build.targets.sdist]
include = ["/ramabana", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "ramabana/__init__.py"

[dependency-groups]
dev = [
    "ramabana[all]",
    "rishi[all]>=0.1.39",
    "nbdev>=3.3.11",
    "notebook>=7.6.1",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "dhrona>=0.1.4",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow' -n auto"
markers = ["slow: spawns the agent as a subprocess or drives a real runtime"]

[tool.uv]
override-dependencies = ["python-fastllm>=0.0.45"]
