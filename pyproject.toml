[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramabana"
dynamic = ["version"]
description = "rama's arrow. a harness that does not miss"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "shalya>=0.0.10",   # tmux panes, git_diff/log/commit/stash, run_cmd_bg, hooks that return
    "uraiyadal>=0.0.7",   # split_think takes the stray close answer_only used to strip itself
    "gheasy>=0.0.10",
    "exhash>=0.4.9",
    "fastcore>=2.1.16",
    "rishi>=0.1.32",
    "fossick>=0.1.17",
    "koshas>=0.1.9",   # `rows` hands `code_row` the hit, so the federated repo leg works
    "litesearch>=0.1.35",
    "liteparse>=2.12,<2.13",
    "rgapi>=0.1.19",
    "vishalakshi>=0.1.16",   # federate names a failed leg
    "fastspec>=0.2.1",
    "pyyaml>=6.0",
    "mcp>=1.2",
    "pobblebonk>=0.0.3",
    "dhrishti>=0.1.2",
    "jupyter-client>=8.9.1",
    "agent-client-protocol>=0.12.1",
]

[project.optional-dependencies]
cli = ["teleprint>=0.1.1", "pyghostty>=0.1.0", "shalya[tmux]>=0.0.10"]
[project.urls]
Repository = "https://github.com/vedicreader/ramabana"
Documentation = "https://vedicreader.github.io/ramabana/"

[project.scripts]
ramabana = "ramabana.cli:main"
ramabana-mcp = "ramabana.mcp:main"
ramabana-acp = "ramabana.racp:main"
ramabana-tick = "ramabana.monitor:tick"

[project.entry-points.nbdev]
ramabana = "ramabana._modidx:d"

[project.entry-points.pyskills]
coding_patterns = "ramabana.coding_patterns"
theory = "ramabana.theory"
write_prose = "ramabana.write_prose"
write_docs = "ramabana.write_docs"

[tool.nbdev]
allowed_cell_metadata_keys = ["leela"]

[tool.hatch.build.targets.wheel]
packages = ["ramabana"]

[tool.hatch.build.targets.sdist]
include = ["/ramabana", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "ramabana/__init__.py"

[dependency-groups]
dev = ["ramabana[cli]", "rishi[all]>=0.1.32", "nbdev>=3.3.11", "notebook>=7.6.1", "pytest>=8.0.0", "pytest-xdist>=3.5.0"]

[tool.pytest.ini_options]
addopts = "-m 'not slow' -n auto"
markers = ["slow: spawns the agent as a subprocess or drives a real runtime"]

[tool.uv]
override-dependencies = ["python-fastllm>=0.0.45"]