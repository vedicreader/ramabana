[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramabana"
dynamic = ["version"]
description = "rama's arrow. a harness that does not miss"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "exhash>=0.4.9",
    "fastcore>=2.1.16",
    "rishi>=0.1.25",
    "fossick>=0.1.11",
    "koshas>=0.0.31",
    "litesearch>=0.1.1",
    "liteparse>=2.12,<2.13",
    "rgapi>=0.1.19",
    "fastllm-claude-code>=0.0.7",
    "vishalakshi>=0.1.11",
    "fastspec>=0.2.1",
    "pyyaml>=6.0",
    "toolslm>=0.3.48",
]

[project.optional-dependencies]
cli = ["teleprint>=0.1.1", "pyghostty>=0.1.0"]
mcp = ["mcp>=1.2"]
copilot = ["rishi>=0.1.25"]
all = ["ramabana[cli,mcp,pyrepl,acp]", "rishi[all]"]
dev = ["ramabana[all]", "rishi[all]>=0.1.25", "nbdev>=3.3.11", "notebook>=7.6.1", "pytest>=8.0.0"]
pyrepl = [
    "ramabana[cli]",
    "dhrishti>=0.1.2",
    "jupyter-client>=8.9.1",
]
acp = [
    "agent-client-protocol>=0.12.1",
]

[project.urls]
Repository = "https://github.com/vedicreader/ramabana"
Documentation = "https://vedicreader.github.io/ramabana/"

[project.scripts]
ramabana = "ramabana.cli:main"
ramabana-mcp = "ramabana.mcp:main"
ramabana-acp = "ramabana.acp:main"

[project.entry-points.nbdev]
ramabana = "ramabana._modidx:d"

[project.entry-points.pyskills]
coding_patterns = "ramabana.coding_patterns"
theory = "ramabana.theory"
write_prose = "ramabana.write_prose"
write_docs = "ramabana.write_docs"

[tool.nbdev]
allowed_cell_metadata_keys = ["leela"]

[tool.hatch.build.targets.wheel]
packages = ["ramabana"]

[tool.hatch.build.targets.sdist]
include = ["/ramabana", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "ramabana/__init__.py"

[dependency-groups]
dev = ["ramabana[dev]"]
