[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramabana"
dynamic = ["version"]
description = "rama's arrow. a harness that does not miss"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "shalya>=0.1.20",   # 0.1.20 panes open beside $TMUX_PANE; 0.1.19 commands get /dev/null as stdin; 0.1.18 docments on every tool parameter; 0.1.17 grep path_filter finds folders
    "uraiyadal>=0.0.16",   # cut_msg_, a reply's reparse and lost, ToolCallError; 0.0.15 parse_tool_tags strips stray <parameter> elements
    "gheasy>=0.0.14",   # 0.0.14 git gets /dev/null as stdin
    "exhash>=0.4.11",
    "fastcore>=2.2.19",
    "rishi>=0.1.54",   # 0.1.54 a cut-off or malformed tool call goes back to the model then raises ToolCallError, default cap is the model's maximum; 0.1.53 claude --version and ollama serve get /dev/null as stdin; 0.1.52 Gemini ids without models/, ClaudeChat retries a failed connect once; 0.1.51 native ClaudeChat tools through MCP, ClaudeMcpRefused, per-call effort, remote effort refusal retry; 0.1.50 Claude Code thinking tokens as reasoning_tokens; 0.1.49 ClaudeChat(on_stall=, timeout_hint=); pins uraiyadal 0.0.15
    "fastspec>=0.2.4",
    "pyyaml>=6.0.3",
    "pobblebonk>=0.0.5",   # retry_after: a schedule's own delay before a retry
    "python-dotenv>=1.0.1",   # the beat reads its keys from beat.env
]

[project.optional-dependencies]
search = ["vishalakshi>=0.1.17",   # note(key=), folder watches, age/stale
          "litesearch>=0.1.35", "koshas>=0.1.10",   # a quiet `sync` prints no progress bar, so `--json` output stays JSON
          "rgapi>=0.1.23", "fossick>=0.1.20"]   # 0.1.20 Chrome and gh_clone git get /dev/null as stdin
python = ["dhrishti>=0.1.3", "jupyter-client>=8.10.0", "rich>=15.0.0"]
serve = ["mcp>=1.29.1", "agent-client-protocol>=0.12.1"]
dhrona = ["dhrona>=0.1.14"]   # `compact_learned(onto=)` for `/learned compact ID`; 0.1.14 the nightly retry and its error text
cli = ["ramabana[search,python]", "teleprint>=0.1.4,<0.1.5", "pyghostty>=0.1.3", "shalya[tmux]>=0.1.20", "fastpylight>=0.1.18"]
all = ["ramabana[search,python,serve,dhrona,cli]"]
dev = ["ramabana[all]", "rishi[all]>=0.1.54", "nbdev>=3.3.25", "notebook>=7.6.2", "pytest>=9.1.1", "pytest-xdist>=3.8.0"]   # CI and the docs build install `.[dev]`

[project.urls]
Repository = "https://github.com/vedicreader/ramabana"
Documentation = "https://vedicreader.github.io/ramabana/"

[project.scripts]
ramabana = "ramabana.setup:run_cli"
ramabana-mcp = "ramabana.setup:run_mcp"
ramabana-acp = "ramabana.setup:run_acp"
ramabana-tick = "ramabana.monitor:tick"
ramabana-learned = "ramabana.learned:learned_cli"
ramabana-pane = "ramabana.setup:run_pane"

[project.entry-points.nbdev]
ramabana = "ramabana._modidx:d"

[project.entry-points.pyskills]
coding_patterns = "ramabana.coding_patterns"
debugging = "ramabana.debugging"
theory = "ramabana.theory"
write_prose = "ramabana.write_prose"
write_docs = "ramabana.write_docs"

[tool.nbdev]
allowed_cell_metadata_keys = ["leela"]

[tool.hatch.build.targets.wheel]
packages = ["ramabana"]

[tool.hatch.build.targets.sdist]
include = ["/ramabana", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "ramabana/__init__.py"

[dependency-groups]
dev = ["ramabana[dev]"]

[tool.pytest.ini_options]
addopts = "-m 'not slow' -n auto"
markers = ["slow: spawns the agent as a subprocess or drives a real runtime"]

[tool.uv]
override-dependencies = ["python-fastllm>=0.0.45"]
