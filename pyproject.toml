[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramabana"
dynamic = ["version"]
description = "rama's arrow. a harness that does not miss"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "shalya>=0.1.26",   # 0.1.26 git_sync merges or rebases onto any ref and git_conflicts settles conflicts; 0.1.25 grep searches a skipped folder that path_filter names; 0.1.24 web fetches reach the logged-in Chrome only for SESSION_HOSTS, and the read-only Kosha index gets env_path; 0.1.23 shell and Python output go through read_guard; 0.1.22 memory_search says what limit counts; 0.1.21 index writes run in a child process; 0.1.20 panes open beside $TMUX_PANE; 0.1.19 commands get /dev/null as stdin; 0.1.18 docments on every tool parameter; 0.1.17 grep path_filter finds folders
    "uraiyadal>=0.0.19",
    "gheasy>=0.0.15",   # 0.0.15 merges never reset away conflicts; 0.0.14 git gets /dev/null as stdin
    "exhash>=0.4.11",
    "fastcore>=2.2.19",
    "rishi>=0.1.61",   # 0.1.61 drops text a model writes after its last tool call; ClaudeChat.set_opts and the cost of a budget stop
    "fastspec>=0.2.4",
    "pyyaml>=6.0.3",
    "pobblebonk>=0.0.5",   # retry_after: a schedule's own delay before a retry
    "python-dotenv>=1.0.1",   # the beat reads its keys from beat.env
]

[project.optional-dependencies]
search = ["vishalakshi>=0.1.35",   # note(key=), folder watches, age/stale; 0.1.35 litesearch 0.1.61
          "litesearch>=0.1.61", "koshas>=0.1.18",   # koshas 0.1.18 indexes the lang filter
          "rgapi>=0.1.23", "fossick>=0.1.22"]   # 0.1.22 plain HTTP verifies TLS and checks each redirect; 0.1.21 cart actions add the requested variant once; 0.1.20 Chrome and gh_clone git get /dev/null as stdin
serve = ["mcp>=1.29.1"]
dhrona = ["dhrona>=0.1.23"]   # 0.1.23 the nightly efficiency check and replays without full clones; 0.1.19 dated lessons on pending/ branches
abhyasa = ["abhyasa[tick]>=0.0.10"]   # the abhyasa-index tick, which indexes sessions into the vault on the beat
cli = ["ramabana[search]", "rich>=15.0.0", "teleprint>=0.1.4,<0.1.5", "pyghostty>=0.1.3", "shalya[tmux]>=0.1.26", "fastpylight>=0.1.18"]
all = ["ramabana[search,serve,dhrona,cli]"]
dev = ["ramabana[all]", "rishi[all]>=0.1.61", "nbdev>=3.3.25", "notebook>=7.6.2", "pytest>=9.1.1", "pytest-xdist>=3.8.0"]   # CI and the docs build install `.[dev]`

[project.urls]
Repository = "https://github.com/vedicreader/ramabana"
Documentation = "https://vedicreader.github.io/ramabana/"

[project.scripts]
ramabana = "ramabana.setup:run_cli"
ramabana-mcp = "ramabana.setup:run_mcp"
ramabana-tick = "ramabana.monitor:tick"
ramabana-learned = "ramabana.learned:learned_cli"
ramabana-pane = "ramabana.setup:run_pane"

[project.entry-points.nbdev]
ramabana = "ramabana._modidx:d"

[project.entry-points.pyskills]
coding_patterns = "ramabana.coding_patterns"
debugging = "ramabana.debugging"
theory = "ramabana.theory"
write_prose = "ramabana.write_prose"
write_docs = "ramabana.write_docs"
peer_work = "ramabana.peer_work"

[tool.nbdev]
allowed_cell_metadata_keys = ["leela"]

[tool.hatch.build.targets.wheel]
packages = ["ramabana"]

[tool.hatch.build.targets.sdist]
include = ["/ramabana", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "ramabana/__init__.py"

[dependency-groups]
dev = ["ramabana[dev]"]

[tool.pytest.ini_options]
addopts = "-m 'not slow' -n auto"
markers = ["slow: spawns the agent as a subprocess or drives a real runtime"]

[tool.uv]
override-dependencies = ["python-fastllm>=0.0.45"]
